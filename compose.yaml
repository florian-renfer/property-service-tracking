services:
  api:
    build:
      context: .
      target: dev
    environment:
      KEYCLOAK_ISSUER_URL: http://keycloak:8080/realms/property-service-tracking
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: sh -c 'exec air'
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.6}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT_HTTPS:-8443}:8443"
      - "127.0.0.1:${KEYCLOAK_PORT:-8090}:8080"
    environment:
      KC_HOSTNAME: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_DB_URL: jdbc:postgresql://postgres:${POSTGRES_PORT}/keycloak
      KC_DB: postgres
      KC_DB_USERNAME:  ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
      - --hostname=keycloak
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/property-service-tracking/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - app-network

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    name: ${COMPOSE_NETWORK_NAME:-app-network}
    driver: bridge

volumes:
  go-mod-cache:
  go-build-cache:
  postgres-data:
